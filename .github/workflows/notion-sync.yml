name: Sync blog posts from Notion

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:       # lets you press a Run button

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull posts from Notion
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      - name: Commit changes
        run: |
          git config user.name "notion-sync"
          git config user.email "notion-sync@users.noreply.github.com"
          mkdir -p src/posts public/blog
          git add -A src/posts public/blog
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync posts from Notion"
            git push
          fi
